[package]
name = "lexgraph"
version = "0.1.0"
edition = "2024"
description = "TeX 数式をグラフ化する Windows デスクトップアプリ"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lexgraph"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", features = ["canvas", "advanced", "tokio"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
resvg = "0.49"
svg2pdf = "0.13"
arboard = "3"
rfd = "0.17"
dirs = "7"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4
